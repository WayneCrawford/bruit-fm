<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OBS Network Details</title>
<meta name="description" content="Stations, channels and sensors of an ocean-bottom seismometer network.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css?v=d655b208">
</head>
<body class="page">
<main class="page-main">
  <nav class="page-nav"><a id="back-to-map" href="index.html">← Back to the map</a></nav>

  <header class="page-header">
    <h1 id="net-id">Network</h1>
    <p class="muted" id="net-name"></p>
  </header>

  <section class="page-top">
    <dl id="net-meta" class="meta-grid"></dl>
    <div id="mini-map" aria-label="Map of the network stations"></div>
  </section>

  <section>
    <h2>Instruments</h2>
    <p class="small muted">Sensor configurations used in the network, as described in the station metadata.</p>
    <div class="table-scroll-x"><table id="instruments" class="data-table"></table></div>
  </section>

  <section id="channels-section">
    <div class="section-head">
      <h2>Station channels</h2>
      <div class="section-tools">
        <input id="filter" type="search" placeholder="Filter by station or sensor…" aria-label="Filter stations">
        <button id="download" class="text-btn" type="button">Download CSV</button>
      </div>
    </div>
    <p class="small muted" id="channels-note"></p>
    <div class="table-scroll-x"><table id="channels" class="data-table"></table></div>
  </section>

  <footer class="muted small" id="page-footer"></footer>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/obs.js?v=d655b208"></script>
<script src="network.js?v=d655b208"></script>
</body>
</html>
